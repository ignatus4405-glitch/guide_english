version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'chore(deps)'
      include: scope
    labels:
      - dependencies
      - automated
    groups:
      npm-minor-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    # Мажорные обновления Electron/electron-store/electron-builder требуют
    # миграции кода (electron-store 9+ — ESM-only) и делаются вручную.
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: 'ci(deps)'
    labels:
      - dependencies
      - github-actions
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
