name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: 'Тип повышения версии'
        required: true
        default: auto
        type: choice
        options: [auto, patch, minor, major]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  NODE_VERSION: '22'
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  version:
    name: Версия, changelog, тег
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      should_release: ${{ steps.prepare.outputs.should_release }}
      version: ${{ steps.prepare.outputs.version }}
      tag: ${{ steps.prepare.outputs.tag }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Установка зависимостей
        run: npm ci --no-audit --no-fund

      - name: Проверка перед релизом
        run: npm test

      - name: Определение версии
        id: decide
        run: node scripts/next-version.js --force "${{ github.event.inputs.bump || 'auto' }}" --github

      - name: Подготовка релиза
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.decide.outputs.version }}"
          BUMP="${{ steps.decide.outputs.bump }}"
          CHANGED="${{ steps.decide.outputs.changed }}"
          PREV="${{ steps.decide.outputs.previousVersion }}"
          TAG_NAME="v$VERSION"

          echo "Решение: bump=$BUMP changed=$CHANGED version=$VERSION (было $PREV)"

          should_release="true"

          # Если тег уже существует — релиз не нужен (защита от повторного запуска)
          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "Тег $TAG_NAME уже существует — пропускаем создание релиза."
            should_release="false"
          fi

          if [ "$CHANGED" != "true" ] && [ "${{ github.event.inputs.bump || 'auto' }}" = "auto" ]; then
            echo "С момента последнего тега нет feat/fix/breaking коммитов — релиз не требуется."
            should_release="false"
          fi

          if [ "$should_release" = "true" ]; then
            npm version "$VERSION" --no-git-tag-version --allow-same-version >/dev/null
            node scripts/generate-docs.js
            node scripts/update-changelog.js "$VERSION" "${{ steps.decide.outputs.tag }}"

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add package.json docs/CHANGELOG.md docs/CONTENT_INDEX.md README.md
            if git diff --staged --quiet; then
              echo "Нет изменений для коммита"
            else
              git commit -m "chore(release): $TAG_NAME [skip ci]"
            fi

            git tag -a "$TAG_NAME" -m "Guide English $TAG_NAME"
            git push origin main
            git push origin "$TAG_NAME"
          fi

          {
            echo "should_release=$should_release"
            echo "version=$VERSION"
            echo "tag=$TAG_NAME"
          } >> "$GITHUB_OUTPUT"

      - name: Сводка версии
        run: |
          echo "### Релиз ${{ steps.prepare.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Релиз создаётся: **${{ steps.prepare.outputs.should_release }}**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Предыдущая версия: \`${{ steps.decide.outputs.previousVersion }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Новая версия: \`${{ steps.prepare.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Коммитов: ${{ steps.decide.outputs.commits }} (feat: ${{ steps.decide.outputs.features }}, fix: ${{ steps.decide.outputs.fixes }})" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Сборка Windows и публикация
    needs: version
    if: needs.version.outputs.should_release == 'true'
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout тега
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Версия сборки
        shell: bash
        run: |
          echo "Собираем ${{ needs.version.outputs.tag }}"
          node -e "console.log('package.json version:', require('./package.json').version)"
          test "$(node -p "require('./package.json').version")" = "${{ needs.version.outputs.version }}"

      - name: Установка зависимостей
        run: npm ci --no-audit --no-fund

      - name: Тесты перед сборкой
        run: npm test

      - name: Release notes из CHANGELOG
        shell: bash
        run: node scripts/extract-release-notes.js "${{ needs.version.outputs.version }}"

      - name: Сборка и публикация в GitHub Releases
        run: npx electron-builder --win --config electron-builder.yml --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Загрузка артефактов в Actions
        uses: actions/upload-artifact@v4
        with:
          name: guide-english-${{ needs.version.outputs.version }}
          path: |
            dist/*.exe
            dist/latest.yml
            dist/*.blockmap
          retention-days: 30
          if-no-files-found: error

      - name: Сводка сборки
        shell: bash
        run: |
          echo "### Сборка ${{ needs.version.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Файл | Размер |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for f in dist/*.exe; do
            size=$(du -h "$f" | cut -f1)
            echo "| \`$(basename "$f")\` | $size |" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Релиз: https://github.com/${{ github.repository }}/releases/tag/${{ needs.version.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
